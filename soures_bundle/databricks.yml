# This is a Databricks asset bundle definition for soures_bundle.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: soures_bundle
  uuid: f356a848-8ff5-42d4-a1b7-e9f17ab36ac8

include:
  - resources/*.yml
  - resources/*/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-317a4476-81a5.cloud.databricks.com
    variables:
      catalog: sources_catalog_dev
      schema: dev
  prod:
    mode: production
    workspace:
      host: https://dbc-317a4476-81a5.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/786maksood@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/786maksood@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: sources_catalog_dev
      schema: prod
    permissions:
      - user_name: 786maksood@gmail.com
        level: CAN_MANAGE
